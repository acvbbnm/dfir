<VirtualHost *:8080>
    ServerName dvwa.lab
    DocumentRoot /var/www/dvwa
    <Directory /var/www/dvwa>
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/ea-dvwa.sock|fcgi://localhost"
    </FilesMatch>
    ErrorLog /var/log/apache2/dvwa-error.log
    CustomLog /var/log/apache2/dvwa-access.log combined
</VirtualHost>
