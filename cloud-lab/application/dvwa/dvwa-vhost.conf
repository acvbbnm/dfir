<VirtualHost *:8081>
    ServerName dvwa.lab.local
    DocumentRoot /var/www/dvwa

    <Directory /var/www/dvwa>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog /var/log/apache2/dvwa-error.log
    CustomLog /var/log/apache2/dvwa-access.log combined
</VirtualHost>
