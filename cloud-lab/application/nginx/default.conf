log_format ea_json escape=json '{"timestamp":"$time_iso8601","request_id":"$request_id",'
  '"trace_id":"$http_x_amzn_trace_id","client_ip":"$remote_addr",'
  '"peer_ip":"$realip_remote_addr","host":"$host","method":"$request_method",'
  '"url":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status"}';
limit_req_zone $binary_remote_addr zone=ea_login:1m rate=20r/m;
upstream app_backend {
    server APP_PRIVATE_IP:8080;
    keepalive 16;
}
server {
    listen 8080;
    server_name _;
    real_ip_header X-Forwarded-For;
    ALB_TRUST_DIRECTIVES
    real_ip_recursive on;
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity/ea.conf;
    modsecurity_transaction_id "$request_id";
    client_max_body_size 20m;
    limit_req_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Overwrite a client-supplied request ID. Trace ID remains untrusted reported data.
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Amzn-Trace-Id $http_x_amzn_trace_id;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    add_header X-Request-ID $request_id always;
    location = /health { return 200 'ok'; access_log off; }
    location = /wp-login.php {
        limit_req zone=ea_login burst=10 nodelay;
        proxy_pass http://app_backend;
    }
    location / { proxy_pass http://app_backend; }
    access_log /var/log/nginx/access.json ea_json;
    error_log /var/log/nginx/error.log warn;
}
